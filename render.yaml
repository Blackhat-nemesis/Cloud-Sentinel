services:
  - type: web
    name: cloud-sentinel-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-sentinel-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: AWS_DEFAULT_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_SESSION_TOKEN
        sync: false
databases:
  - name: cloud-sentinel-db
    plan: free
    region: singapore
    databaseName: cloudsentinel
    user: cloudsentinel
